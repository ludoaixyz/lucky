name: Bug report
description: Report a reproducible defect in the prototype or tooling
title: 'bug: '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include secrets or real-money/payment information.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include commands, seed/configuration ID, and minimal steps.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Windows 11, Node 22, browser version
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Relevant output
      render: shell

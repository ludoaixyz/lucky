<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="LUCKY888 Bathala Slot Prototype Analysis report" />
    <title>LUCKY888 — Bathala Slot Prototype Analysis</title>

    <header class="report-toolbar">
      <a class="report-brand" href="../" aria-label="LUCKY888 prototype">
        <strong>LUCKY888</strong><span>Bathala Slot Prototype Analysis</span>
      </a>
      <div class="toolbar-actions">
        <nav class="language-selector" aria-label="Language"></nav>
        <button
          id="contents-button"
          type="button"
          aria-expanded="false"
          aria-controls="contents-panel"

      <div id="report-status" class="report-status" role="status">Loading report…</div>
      <div id="report" class="report-host" aria-label="Bathala Slot Prototype Analysis"></div>
    </main>
    <p id="language-announcement" class="visually-hidden" aria-live="polite"></p>
    <script type="module" src="/src/main.ts"></script>
